version: "3.7"
services:
  postgres:
    image: postgres:16-alpine
    container_name: stockcontrol-postgres
    restart: unless-stopped
    env_file:
      - ./env/.env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - stockcontrol_net
  api:
    build:
      context: ../api
      dockerfile: Dockerfile
    container_name: stockcontrol-api
    restart: unless-stopped
    env_file:
      - ./env/.env
    environment:
      PORT: 8080
      UPLOAD_DIR: /data/uploads
    command:
      [
        "sh",
        "-c",
        "if [ -z \"$DATABASE_URL\" ]; then export DATABASE_URL=\"postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}\"; fi; node dist/index.js",
      ]
    depends_on:
      - postgres
    networks:
      - stockcontrol_net
    ports:
      - "${API_HOST_PORT:-8088}:8080"
    volumes:
      - api_uploads:/data/uploads
  pgbackups:
    image: prodrigestivill/postgres-backup-local:15
    container_name: stockcontrol-pgbackups
    restart: unless-stopped
    env_file:
      - ./env/.env
    environment:
      POSTGRES_HOST: postgres
      SCHEDULE: "0 2 * * *"
      BACKUP_DIR: /backups
    volumes:
      - pg_backups:/backups
    depends_on:
      - postgres
    networks:
      - stockcontrol_net
  netdata:
    image: netdata/netdata:stable
    container_name: stockcontrol-netdata
    restart: unless-stopped
    cap_add:
      - SYS_PTRACE
    ports:
      - "19999:19999"
    volumes:
      - netdata_config:/etc/netdata
      - netdata_cache:/var/cache/netdata
      - /etc/passwd:/host/etc/passwd:ro
      - /etc/group:/host/etc/group:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /etc/os-release:/host/etc/os-release:ro
    networks:
      - stockcontrol_net
networks:
  stockcontrol_net:
volumes:
  postgres_data:
  pg_backups:
  netdata_config:
  netdata_cache:
  api_uploads:
